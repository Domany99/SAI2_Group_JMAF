id: strapi-auth-false
title: Strapi-Kommentare mit auth false für alle Aktionen
version: 1
order: 2
decoy: false

scenario:
  requirement: >
    Lea baut im WSEG mit ihrer Gruppe eine Projektplattform mit Vue und Strapi.
    Unter jedem Projekt sollen Besucherinnen und Besucher Kommentare schreiben
    können, auch ohne Login. Beim Absenden erscheint aber "Fehler: 403". Lea
    gibt Copilot im Agent-Modus den Auftrag "beim erstellen eines kommentars
    kommt ein 403 von strapi. fix das". Danach funktioniert das Formular. Im
    Strapi-Admin ist unter Roles, Public bei Comment weiterhin nichts
    angehakt. Lea will die Änderung heute ins Gruppen-Repo pushen.
  # Echter Lauf: GitHub Copilot, Agent-Modus, MAI-Code-1.1 Flash, 13.11.2026 (gekürzt)
  ai_chat: |
    Ich habe das Problem behoben: Der Kommentar-Endpunkt war standardmässig
    durch Strapi geschützt und hat POST-Requests mit 403 verweigert.
    Zusätzlich war CORS für den Vite-Frontend-Server nicht erlaubt.
    Geändert: backend/src/api/comment/routes/comment.js,
    create/find/findOne/update/delete auf auth: false gesetzt.
    backend/config/middlewares.js, CORS für http://localhost:5173 und
    http://127.0.0.1:5173 erlaubt.
  # Wörtlich aus dem Lauf, nur die Route. Die CORS-Änderung ist nicht nötig für die Aufgabe.
  code: |
    'use strict';

    /**
     * comment router
     */

    const { createCoreRouter } = require('@strapi/strapi').factories;

    module.exports = createCoreRouter('api::comment.comment', {
      config: {
        find: { auth: false },
        findOne: { auth: false },
        create: { auth: false },
        update: { auth: false },
        delete: { auth: false },
      },
    });

answer_key:
  issue: >
    Für das Erstellen eines Kommentars hätte create gereicht. Die KI hat mit
    auth false aber alle fünf Aktionen geöffnet, auch update und delete. Weil
    auth false die Prüfung in der Route abschaltet, werden die Rollen gar nicht
    mehr gefragt, und das Admin-Panel zeigt keine Freigabe an.
  consequence: >
    Jede Person kann ohne Anmeldung fremde Kommentare umschreiben oder löschen,
    zum Beispiel per Skript über die documentId aus der öffentlichen Liste. Im
    Admin-Panel ist davon nichts zu sehen.
  accepted:
    - "ohne Login kann jeder fremde Kommentare ändern oder löschen, weil auth: false die Rechteprüfung in der Route abschaltet"
    - "update und delete sind für alle offen, nicht nur create, weil auth: false die Rollen umgeht, also kann jeder fremde Kommentare ändern oder löschen"
    - "auth false schaltet die Rechteprüfung für alle Aktionen ab, so kann jeder ohne Login fremde Kommentare löschen, und im Admin sieht man nichts"
    - "Fremde können Kommentare von anderen umschreiben oder alle löschen, weil update und delete ohne Login gehen, und im Admin-Panel ist davon nichts zu sehen"
    - "über find bekommt man alle IDs und kann damit ohne Login jeden Kommentar löschen, weil auth: false auch delete freigibt"
  # Pflichtbausteine für grader_v3: "recognized" verlangt alle. Jede accepted-Antwort enthält alle.
  # Ein Gedanke pro Baustein, ohne Nebensätze: Das Modell prüft sonst jeden Teilsatz (Probelauf 10).
  # Drei Bausteine wie im Raster des Aufgabe-2-Dokuments (Entscheid 24.11.2026): Der
  # unsichtbare Umweg über auth: false ist der Kern dieser Übung, nicht nur ein Zusatz.
  required:
    - "Ändern und Löschen gehen ohne Login"
    - "Ursache: auth: false in der Route schaltet die Rechteprüfung ab (oder: im Admin-Panel ist keine Freigabe zu sehen)"
    - "Folge: Fremde können Kommentare anderer ändern oder löschen"

stages:
  1:
    goal: Auf die freigegebenen Aktionen lenken, ohne zu sagen, welche zu viel sind
    # TODO Expert:in: Vorschlag aus Aufgabe 2. Der finale Hint kommt von der Fachperson (Gold Standard).
    hint: "Lea wollte, dass Besucher Kommentare schreiben können. Schau in die Route: Welche Aktionen hat die KI dafür freigegeben, und welche davon braucht das Formular wirklich?"
    forbidden: ["auth", "update", "delete", "PUT", "löschen", "ändern", "umschreiben", "Berechtigung", "Rolle", "Login", "Anmeldung", "fremde", "Admin"]
  2:
    goal: Jede Aktion einer HTTP-Methode und einer Personengruppe zuordnen
    # TODO Expert:in: Vorschlag aus Aufgabe 2. Der finale Hint kommt von der Fachperson (Gold Standard).
    hint: "Geh die fünf Zeilen einzeln durch. Welche Anfrage gehört zu welcher Aktion (GET, POST, PUT, DELETE), und wer darf sie jetzt schicken: nur Lea, alle Eingeloggten oder alle?"
    forbidden: ["auth", "löschen", "ändern", "umschreiben", "fremde Kommentare", "Admin", "Berechtigung", "Rolle"]
  3:
    goal: Übertragung über eine Analogie, die Person verbindet sie selbst mit dem Code
    # TODO Expert:in: Vorschlag aus Aufgabe 2. Der finale Hint kommt von der Fachperson (Gold Standard).
    hint: "Damit Besucher Post einwerfen können, entfernt jemand das Schloss an der Haustür. Die Post kommt jetzt an. Was ist sonst noch möglich, und würde man es von aussen am Haus sehen?"
    forbidden: []

close:
  # Getestet am 17.11.2026: Mit dem Fix ergeben PUT und DELETE ohne Login 405 statt 200.
  fix: >
    auth false entfernen und nur die nötigen Routen anlegen:
    createCoreRouter('api::comment.comment', { only: ['find', 'findOne', 'create'] }).
    Im Admin unter Roles, Public bei Comment nur create, find und findOne
    freigeben, sichtbar und widerrufbar. Gegen Spam die Textlänge im Schema
    begrenzen (maxLength) und Anfragen per Middleware begrenzen.
  pruefmuster: "Wer darf was, und wo wird es geprüft? Für jede Aktion: alle, Eingeloggte oder nur die Besitzerin? Und steht die Regel dort, wo man sie sieht, in der Rolle im Admin, oder versteckt im Code?"
  reflection:
    personal: "Stell dir vor, jemand ändert deinen Kommentar unter dem Projekt eurer Gruppe in etwas Peinliches, und niemand kann nachvollziehen, wer es war."
    questions:
      - "In einem zweiten Lauf hat die KI nur create geöffnet. Ist das in Ordnung? Und wer hat eigentlich entschieden, dass alle ohne Login kommentieren dürfen?"
  # Erst nach dem Erkennen und nur, wenn die Person keinen eigenen Fix findet. Wahl begründen lassen.
  fix_choices:
    - text: "auth: false entfernen und in der Public-Rolle nur create, find und findOne freigeben"
      verdict: correct
      reason: "Öffnet nur das Nötige, und die Regel ist im Admin sichtbar und widerrufbar."
    - text: "auth: false nur bei create stehen lassen"
      verdict: partial
      reason: "Funktioniert und öffnet nur das Nötige, die Regel bleibt im Admin aber unsichtbar (Ergebnis von Agent-Lauf 2)."
    - text: "CORS strenger einstellen"
      verdict: wrong
      reason: "CORS hält nur Browser auf, keine Skripte."
    - text: "Den Löschen-Button im Frontend weglassen"
      verdict: wrong
      reason: "Die API bleibt offen, für eine Anfrage braucht man das Frontend nicht."
    - text: "Der Rolle Authenticated alle Rechte geben"
      verdict: wrong
      reason: "Dann kann jede eingeloggte Person fremde Kommentare ändern und löschen. Strapi prüft ohne eigene Policy nicht, wem ein Kommentar gehört."

# Der Grader gibt die id als "misconception" zurück. Die Reaktion greift die Annahme auf, statt sie als falsch zu markieren.
# TODO Expert:in: Reaktionen aus Aufgabe 2, noch nicht von der Fachperson geprüft.
misconceptions:
  - id: admin-leer
    belief: "Im Admin ist bei Public nichts angehakt, also darf niemand etwas."
    reaction: "Gut, dass du im Admin nachschaust, dort gehören Rechte hin. Die KI hat aber nicht im Admin etwas geändert, sondern in der Route. Was bewirkt auth: false dort? Wird die Rolle dann überhaupt noch gefragt?"
  - id: oeffentlich-gewollt
    belief: "Kommentare sollen ja öffentlich sein, das ist so gewollt."
    reaction: "Erstellen ja, das war Leas Wunsch. Was ist mit Ändern und Löschen: Wer sollte das in einer Kommentarfunktion dürfen?"
  - id: cors-schuetzt
    belief: "CORS erlaubt nur localhost:5173, also kommt niemand sonst an die API."
    reaction: "CORS ist eine Regel, die der Browser einhält. Braucht man einen Browser, um eine Anfrage an die API zu schicken?"
  - id: id-zufaellig
    belief: "Man müsste die ID eines Kommentars kennen, die ist zufällig."
    reaction: "Stimmt, erraten lässt sie sich kaum. Welche der fünf Aktionen liefert dir aber alle Kommentare mitsamt ID?"
  - id: login-ueberall
    belief: "Ich würde einfach für alles einen Login verlangen."
    reaction: "Das wäre sicher, aber Lea will Kommentare ohne Login. Welche Aktionen müssen offen sein, und welche nicht?"
  - id: ki-hat-behoben
    belief: "Die KI hat ja gesagt, das Problem sei behoben."
    reaction: "Der 403 ist weg, das stimmt. Hat die KI dabei auch etwas geändert, nach dem Lea gar nicht gefragt hat?"
  - id: textpruefung
    belief: "Man müsste den Kommentartext prüfen, zum Beispiel die Länge und Sonderzeichen."
    reaction: "Guter Punkt, die Länge solltest du im Backend begrenzen. Angenommen, der Text ist perfekt geprüft: Was kann eine fremde Person mit deinem Kommentar trotzdem noch machen?"
