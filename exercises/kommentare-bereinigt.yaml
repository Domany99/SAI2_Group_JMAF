close:
  fix: >
    Kein Fix nötig. Die Bereinigung beim Anzeigen beibehalten, auch wenn das
    Formular schon vor dem Speichern bereinigt, weil die API öffentlich
    beschreibbar ist. Für die Wartung: die eigene Funktion durch eine geprüfte
    Bibliothek wie DOMPurify ersetzen, mit derselben Positivliste. Wer die
    Positivliste später erweitert, etwa um img oder style, muss sie neu prüfen.
  pruefmuster: "Bevor du eine Lücke meldest: Woher kommen die Daten, wo landen sie, und wird dazwischen bereinigt? Bereinigung beim Anzeigen schützt auch vor Daten, die am Formular vorbei kommen."
  reflection:
    personal: "Wenn du in deinem Projekt v-html siehst, frag nicht zuerst, ob es gefährlich ist, sondern was davor mit den Daten passiert."
  fix_choices:
    - text: "Nichts ändern, die Bereinigung beim Anzeigen beibehalten"
      verdict: correct
      reason: "Der Code ist in Ordnung. Die Bereinigung beim Anzeigen schützt auch vor direkten API-Aufrufen."
    - text: "sanitizeHtml durch DOMPurify mit derselben Positivliste ersetzen"
      verdict: correct
      reason: "Gleichwertig und bei künftigen Änderungen robuster."
    - text: "Nur noch beim Speichern bereinigen, das Anzeigen vereinfachen"
      verdict: wrong
      reason: "Wer direkt an die API schickt, umgeht das Formular. Ungeprüftes HTML käme in v-html."
    - text: "v-html durch {{ }} ersetzen"
      verdict: wrong
      reason: "Dann erscheint der HTML-Code als Text, Fettschrift und Links funktionieren nicht mehr. Die Anforderung ist verfehlt."

