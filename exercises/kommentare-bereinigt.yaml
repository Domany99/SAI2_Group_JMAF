misconceptions:
  - id: v-html-immer-unsicher
    belief: "v-html ist immer unsicher."
    reaction: "v-html setzt HTML ein, das stimmt, deshalb lohnt sich der Blick davor. Was passiert mit dem Text, bevor er bei v-html ankommt?"
  - id: script-nicht-gefiltert
    belief: "Es fehlt ein Filter für <script>."
    reaction: "Schau, was die Funktion mit Tags macht, die nicht in allowedTags stehen. Was bleibt von einem Script-Tag übrig?"
  - id: javascript-links
    belief: "Man kann einen Link mit javascript: einschleusen."
    reaction: "Spiel es durch: Was macht die Funktion mit einem Link, dessen Adresse nicht mit http oder https beginnt?"
  - id: nur-beim-speichern
    belief: "Es reicht, beim Speichern zu bereinigen."
    reaction: "Wer schickt die Kommentare an die API? Muss das immer Leas Formular sein?"
  - id: ki-code-unsicher
    belief: "Das hat eine KI geschrieben, also ist es unsicher."
    reaction: "Woran im Code selbst machst du das fest?"
  - id: ki-hat-bereinigt
    belief: "Die KI sagt, unsichere Inhalte werden entfernt, also passt es."
    reaction: "Das sagt die KI. Wo im Code passiert das, und was genau wird entfernt?"
  - id: eigener-filter
    belief: "Eigene Filter sind immer lückenhaft, das ist unsicher."
    reaction: "Für die Wartung ist eine geprüfte Bibliothek oft besser, das stimmt. Findest du in dieser Funktion einen konkreten Weg, wie Code durchkommt?"
