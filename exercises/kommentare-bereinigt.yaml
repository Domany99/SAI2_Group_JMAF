id: kommentare-bereinigt
title: Kommentare mit Fettschrift und Links, per v-html angezeigt
version: 1
order: 4
# Decoy: Der Code ist in Ordnung. "recognized" heisst, die Person beurteilt ihn
# als sicher und nennt einen Grund aus sanitizeHtml.
decoy: true

scenario:
  requirement: >
    Lea und ihre Gruppe bauen im WSEG eine Projektplattform mit Vue und
    Strapi. Unter jedem Projekt können Besucherinnen und Besucher ohne Login
    Kommentare schreiben. Die Rechte sind sauber gesetzt: Im Strapi-Admin darf
    die Rolle Public bei Comment nur create, find und findOne. Jetzt sollen
    die Kommentare unter dem Formular erscheinen, und man soll darin fett
    schreiben und Links setzen können. Lea gibt das Copilot im Agent-Modus.
    Die Funktion läuft. Lea will die Änderung heute ins Gruppen-Repo pushen.
  # Echter Lauf 8: GitHub Copilot, Agent-Modus, MAI-Code-2 Flash, 17.11.2026.
  # Prompt und Antwort wörtlich, die Antwort vollständig.
  ai_chat: |
    Lea: zeige unter dem formular alle kommentare an. man soll in kommentaren
    auch fett schreiben und links setzen können

    KI: Das Formular zeigt jetzt alle Kommentare darunter an.
    Fettgedruckten Text und Links sind möglich
    Kommentare werden beim Speichern automatisch aktualisiert
    HTML wird bereinigt und unsichere Inhalte werden entfernt
  filename: "CommentForm.vue (Ausschnitt)"
  # Wörtlich aus Lauf 8, gekürzt auf Bereinigung, Laden und Anzeige. Das
  # Formular bereinigt zusätzlich vor dem Speichern (nicht gezeigt). Rund 55
  # Zeilen, entschieden am 22.11.: Die Funktion muss ganz beurteilt werden.
  code: |
    function sanitizeHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = html;

      const allowedTags = new Set(["B", "STRONG", "A", "BR", "DIV", "P"]);

      function clean(node) {
        [...node.childNodes].forEach((child) => {
          if (child.nodeType === Node.TEXT_NODE) return;

          if (child.nodeType !== Node.ELEMENT_NODE || !allowedTags.has(child.tagName)) {
            clean(child);
            child.replaceWith(...child.childNodes);
            return;
          }

          if (child.tagName === "A") {
            const href = child.getAttribute("href") || "";
            try {
              const url = new URL(href, window.location.href);
              if (url.protocol !== "http:" && url.protocol !== "https:") {
                child.replaceWith(...child.childNodes);
                return;
              }
              [...child.attributes].forEach((attribute) => child.removeAttribute(attribute.name));
              child.setAttribute("href", url.href);
              child.setAttribute("target", "_blank");
              child.setAttribute("rel", "noopener noreferrer");
            } catch {
              child.replaceWith(...child.childNodes);
              return;
            }
          } else {
            [...child.attributes].forEach((attribute) => child.removeAttribute(attribute.name));
          }

          clean(child);
        });
      }

      clean(template.content);
      return template.innerHTML;
    }

    async function loadComments() {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error(`Kommentare konnten nicht geladen werden (${response.status})`);

      const result = await response.json();
      comments.value = result.data.map((item) => ({
        id: item.documentId || item.id,
        text: sanitizeHtml(item.text || ""),
      })).reverse();
    }

    <!-- Template (Ausschnitt) -->
    <article v-for="comment in comments" :key="comment.id" class="comment">
      <div v-html="comment.text"></div>
    </article>

answer_key:
  # Bei Decoys: warum der Code in Ordnung ist (siehe README, Entscheid "Decoys").
  issue: >
    Der Code ist in Ordnung. Zwischen Quelle (Kommentartext aus Strapi, von
    Fremden geschrieben) und Senke (v-html) liegt sanitizeHtml, beim Laden auf
    jeden Kommentar angewendet. (1) Positivliste: Nur b, strong, a, br, div
    und p bleiben, alle anderen Elemente werden ausgepackt, nur ihr Text
    bleibt. (2) Alle Attribute werden entfernt, also auch onerror, onmouseover
    und style. (3) Links behalten nur ein href mit http: oder https:,
    javascript: und data: fallen weg. (4) Bereinigt wird beim Anzeigen, das
    schützt auch vor Kommentaren, die jemand am Formular vorbei direkt an die
    API schickt. Eine geprüfte Bibliothek wie DOMPurify wäre bei künftigen
    Änderungen robuster (OWASP-Empfehlung), eine Lücke in diesem Code ist das
    aber nicht.
  # Getestet am 17.11.2026 (3 Angriffe über die API) und am 22.11.2026 in
  # Chromium mit 30 Eingaben, darunter Mutation-XSS-Muster: keine Ausführung.
  consequence: >
    Kein fremdes Skript wird ausgeführt. Fremde können Text, Fettschrift und
    Links auf http(s)-Seiten setzen, das ist gewollt.
  accepted:
    - "die Kommentare werden vor v-html bereinigt, nur ein paar Tags bleiben und alle Attribute werden entfernt, also kein Skript"
    - "onerror oder onclick kommen nicht durch, weil sanitizeHtml alle Attribute löscht, und Links nur mit http oder https bleiben"
    - "v-html ist hier in Ordnung, weil beim Anzeigen bereinigt wird, auch wenn jemand direkt an die API schickt"
    - "sicher, die Positivliste lässt nur b, strong, a, br, div und p durch, ich würde trotzdem DOMPurify statt einer eigenen Funktion nehmen"
  # Pflichtbausteine für grader_v3: "recognized" verlangt alle. Jede accepted-Antwort enthält alle.
  # Ein Gedanke pro Baustein, ohne Nebensätze: Das Modell prüft sonst jeden Teilsatz (Probelauf 10).
  required:
    - "Urteil: Der Code ist in Ordnung, fremdes Skript wird nicht ausgeführt"
    - "Grund aus sanitizeHtml: Positivliste, alle Attribute entfernt, nur http(s)-Links oder Bereinigung beim Anzeigen (einer davon genügt)"

