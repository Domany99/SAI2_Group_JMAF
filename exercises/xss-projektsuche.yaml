id: xss-projektsuche
title: Suchbegriff aus dem Link per innerHTML in der Projektsuche
version: 1
order: 3
decoy: false

scenario:
  requirement: >
    Lea hat für das Webmodul eine Portfolio-Seite auf GitHub Pages gebaut. Sie
    möchte eine Suche für ihre Projekte und Links teilen können, die direkt
    gefiltert öffnen, zum Beispiel für eine Bewerbung. Die Seite hat ein
    Suchfeld (id search) und eine leere Liste (id project-list). Die Datei
    projects.json mit drei Projekten (title, description) liegt im selben
    Repository. Lea will die Seite heute veröffentlichen und den Link in ihre
    Bewerbung schreiben.
  # Konstruiert, nicht aus einem echten Lauf: In 5 von 5 Tests war der Code der
  # KI für diesen Prompt sicher. Gegenüber Studierenden als nachgebaut deklarieren.
  ai_chat: |
    Lea: füge meiner projektseite eine suche hinzu. man soll auch einen link
    mit dem suchbegriff teilen können zb ?q=python. sende mir den kompletten code

    (Für diese Übung nachgebaut, nach dem Muster aus einem echten
    Studierendenprojekt.)
  # Wörtlich aus dem Aufgabe-3-Dokument, getestet in Chromium am 20.10.2026.
  # Länger als 20 Zeilen: Das Suchfeld und sein Listener werden für die
  # Fehlannahme "suchfeld-pruefen" gebraucht, gekürzter Code wäre ungetestet.
  code: |
    // Suchbegriff aus der URL lesen, z.B. index.html?q=python
    const params = new URLSearchParams(window.location.search);
    const query = params.get("q") || "";

    const searchInput = document.getElementById("search");
    const list = document.getElementById("project-list");
    let allProjects = [];

    searchInput.value = query;

    // Projekte aus der JSON-Datei laden
    async function loadProjects() {
      const response = await fetch("projects.json");
      allProjects = await response.json();
      renderProjects(query);
    }

    // Gefilterte Projekte anzeigen
    function renderProjects(term) {
      const filtered = allProjects.filter((p) =>
        p.title.toLowerCase().includes(term.toLowerCase())
      );

      if (filtered.length === 0) {
        list.innerHTML = `<li class="empty">Keine Projekte gefunden für «${term}».</li>`;
        return;
      }

      list.innerHTML = filtered
        .map((p) => `<li><h3>${p.title}</h3><p>${p.description}</p></li>`)
        .join("");
    }

    // Bei jeder Eingabe neu filtern
    searchInput.addEventListener("input", () => renderProjects(searchInput.value));

    loadProjects();

answer_key:
  issue: >
    Der Suchbegriff kommt aus der URL (params.get("q")), also bestimmt ihn, wer
    den Link verschickt. Passt er zu keinem Projekt, schreibt der Code ihn per
    innerHTML als HTML in die Meldung "Keine Projekte gefunden". Jeder
    Angriffstext landet in diesem Zweig.
  consequence: >
    Ein präparierter Link wie index.html?q=<img src=x onerror=...> führt beim
    Öffnen beliebiges JavaScript im Namen von Leas Seite aus: Inhalte fälschen,
    etwa ein falsches Kontaktformular, Besucher umleiten, Daten im Browser
    derselben Herkunft lesen. Ein Test mit <script> schlägt fehl, weil der
    Browser Script-Tags über innerHTML nicht ausführt.
  accepted:
    - "über den q-Parameter im Link kann jeder eigenes HTML einschleusen, das per innerHTML eingefügt wird, und so ein Skript auf Leas Seite starten"
    - "der Suchbegriff aus der URL landet ungeprüft im innerHTML der Meldung, so läuft fremder Code auf Leas Seite"
    - "wer den Link baut, kann ein img mit onerror in den Suchbegriff setzen, das über innerHTML eingefügt und ausgeführt wird"
    - "der Begriff aus dem Link wird als HTML statt als Text angezeigt, damit kann man fremdes Skript ausführen"
    - "Cross-Site-Scripting: Quelle ist die URL, Senke ist innerHTML, Besucher führen fremden Code aus"
  # Pflichtbausteine für grader_v3: "recognized" verlangt alle. Jede accepted-Antwort enthält alle.
  # Ein Gedanke pro Baustein, ohne Nebensätze: Das Modell prüft sonst jeden Teilsatz (Probelauf 10).
  required:
    - "Der Suchbegriff kommt aus dem Link, also kann ihn jeder bestimmen"
    - "Er wird als HTML eingefügt (innerHTML)"
    - "Folge: Fremder Code läuft im Browser der Besucher"

stages:
  1:
    goal: Auf die Quelle des Suchbegriffs und seinen Weg in die Seite lenken, ohne die Senke zu nennen
    # TODO Expert:in: Vorschlag aus Aufgabe 3, ähnlich den Stufen des WSEG-Dozenten (10.11.). Final durch die Fachperson.
    hint: "Lea will einen Link mit Suchbegriff verschicken. Wer bestimmt eigentlich, was in diesem Suchbegriff steht, und an welcher Stelle taucht er auf der Seite wieder auf?"
    forbidden: ["innerHTML", "HTML", "textContent", "XSS", "Cross-Site", "Scripting", "Script", "JavaScript", "onerror", "img", "einschleusen", "Injection", "Angriff", "Angreifer", "Schadcode", "unsicher"]
  2:
    goal: Den Weg der Daten von der URL bis zur Meldung verfolgen lassen
    # TODO Expert:in: Vorschlag aus Aufgabe 3. Final durch die Fachperson.
    hint: "Verfolge den Suchbegriff von der URL bis zur Meldung 'Keine Projekte gefunden'. Wird er dort als Text eingefügt oder als HTML? Was ändert sich, wenn er spitze Klammern enthält?"
    forbidden: ["innerHTML", "textContent", "XSS", "Cross-Site", "Scripting", "Script", "JavaScript", "onerror", "img", "einschleusen", "Injection", "Angriff", "Schadcode"]
  3:
    goal: Übertragung über ein Gästebuch-Beispiel, die Person verbindet es selbst mit dem Link
    # TODO Expert:in: Vorschlag aus Aufgabe 3. Final durch die Fachperson.
    hint: "Stell dir ein Gästebuch vor: Jemand trägt als Namen <b>Anna</b> ein, und auf der Seite steht der Name fett. Das Gästebuch hat also HTML von einer fremden Person übernommen. Was könnte jemand statt Fettschrift noch einschleusen, und gilt das auch für Leas Link?"
    # Auch Stufe 3 nennt den fertigen Angriff nicht.
    forbidden: ["XSS", "Cross-Site", "onerror"]

close:
  fix: >
    innerHTML durch textContent ersetzen und die Elemente einzeln bauen, dann
    behandelt der Browser den Suchbegriff immer als Text. In der Meldung:
    const empty = document.createElement("li"); empty.textContent =
    `Keine Projekte gefunden für «${term}».`; list.replaceChildren(empty);
    Die Projektliste ebenso mit createElement und textContent bauen. Sie war
    kein direkter Angriffsweg, aber wer überall textContent nutzt, muss nicht
    bei jeder Stelle neu überlegen. Getestet am 20.10.2026: Alle Testeingaben
    erscheinen nur noch als Text.
  pruefmuster: "Quelle und Senke: Woher kommen die Daten (URL, Formular, fremde API, localStorage)? Wo landen sie (innerHTML, outerHTML, insertAdjacentHTML, document.write)? Fremde Quelle plus HTML-Senke heisst: auf textContent umstellen."
  # Zweite Frage: deklariert den nachgebauten Code und nennt den Befund der
  # KI-Läufe 5 bis 9 (Aufgabe-3-Dokument), damit die Frage ohne Dialog trägt.
  reflection:
    personal: "Stell dir vor, jemand verschickt einen Link auf deine Portfolio-Seite, und dort steht plötzlich ein gefälschtes Kontaktformular, das in deinem Namen Daten abgreift."
    questions:
      - "Schau in deinen eigenen Code: Wo verwendest du innerHTML, und woher kommen dort die Daten?"
      - "Diese Übung ist nachgebaut: In unseren Tests schrieb die KI für Leas Auftrag sicheren Code. Unsicher wurde ihr Code erst, wenn innerHTML schon im Projekt stand, dann führte sie das Muster ohne Warnung weiter. Steht in deinem Projekt schon irgendwo innerHTML?"
  # Laut Aufgabe-3-Dokument nur der richtige Fix und drei falsche. Eigene
  # Escape-Funktion, Regex-Prüfung und CSP sind teilweise richtig und bleiben
  # draussen, damit die Auswahl scharf bleibt.
  fix_choices:
    - text: "innerHTML durch textContent ersetzen und die Elemente einzeln bauen"
      verdict: correct
      reason: "Der Browser behandelt den Suchbegriff immer als Text, egal was er enthält."
    - text: "<script> aus dem Suchbegriff herausfiltern"
      verdict: wrong
      reason: "Der Angriff braucht kein Script-Tag, ein Bild mit onerror genügt. Filterlisten sind fast immer lückenhaft."
    - text: "Eingaben im Suchfeld prüfen (pattern, maxlength)"
      verdict: wrong
      reason: "Der Angriff kommt über den Link, nicht über das Feld. Die Prüfung wird gar nie durchlaufen."
    - text: "Suchbegriff mit encodeURIComponent ausgeben"
      verdict: wrong
      reason: "Falscher Kontext: Das kodiert für URLs, nicht für HTML, und zeigt den Text verunstaltet an."

