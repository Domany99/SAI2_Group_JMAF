misconceptions:
  - id: script-test
    belief: "Ich habe <script> eingegeben, nichts ist passiert, also ist der Code sicher."
    reaction: "Gut, dass du es ausprobiert hast, und du hast recht: Script-Tags, die auf diesem Weg in die Seite kommen, führt der Browser nicht aus. Heisst das schon, dass gar kein HTML wirkt? Probier mal, ob Formatierung durchkommt."
  - id: projektliste
    belief: "Die Projektliste mit innerHTML ist das Problem."
    reaction: "Gute Stelle, dort steht dasselbe innerHTML. Woher kommen die Daten an dieser Stelle, und woher in der Meldung darunter? Wer kann was davon beeinflussen?"
  - id: suchfeld-pruefen
    belief: "Das Suchfeld ist das Problem, man muss die Eingabe prüfen."
    reaction: "Wer etwas ins Suchfeld tippt, trifft nur sich selbst. Welcher andere Weg führt einen Suchbegriff auf die Seite, und wer kontrolliert ihn?"
  - id: nur-portfolio
    belief: "Das ist doch nur eine Portfolio-Seite ohne Login, also egal."
    reaction: "Lea schickt den Link mit ihrer Bewerbung. Was wäre, wenn jemand einen ähnlichen Link mit einem gefälschten Kontaktformular auf Leas Seite herumschickt?"
